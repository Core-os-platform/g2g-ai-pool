# G2G AI Pool — Fly.io configuration
# Deploy: fly launch --no-deploy → set secrets → fly deploy

app = "g2g-ai-pool"
primary_region = "sin"  # Singapore — lowest latency to Thailand

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  USD_TO_THB = "36.0"
  MARKUP_BASE = "3.5"
  MARKUP_FLOOR = "3.0"
  MARKUP_BLENDED_TARGET = "4.0"
  GOV_SLA_PREMIUM = "0.10"
  ARBITRAGE_ENABLED = "true"
  QUOTA_DEGRADE_THRESHOLD = "0.85"
  AIRTABLE_BASE = "appRQwVddDxQdU6P3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
